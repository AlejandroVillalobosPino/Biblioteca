name: CI API Build & Test

# ¿Cuándo se ejecuta esto? Cuando hagamos push o pull request a la rama principal
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Copia nuestro código al servidor de GitHub
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # 2. Instala Node.js versión 22
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 3. Instala dependencias
      - name: Instalar dependencias
        run: npm ci

      # 4. Generar cliente Prisma (si aplica)
      - name: Generar Prisma
        run: npx prisma generate

      # 5. Ejecutar los tests con Jest
      - name: Ejecutar Tests
        run: npm test